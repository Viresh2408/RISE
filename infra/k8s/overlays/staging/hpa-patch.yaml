# Staging autoscaling bounds (smaller than prod's 3-10).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rise-api
spec:
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
