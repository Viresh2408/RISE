# Prod IRSA patch: binds the rise-api ServiceAccount to the production IAM role
# (EKS IRSA). The 12-digit account id is a placeholder — the real role ARN is
# an output of the prod Terraform stack (infra/terraform, iam_roles module) and
# is injected by CI at deploy time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rise-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/rise-prod-rise-api-irsa
