# Staging IRSA patch: binds rise-api SA to the staging IAM role. The account id
# is a placeholder; the real role ARN is a Terraform output injected by CI.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rise-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/rise-staging-rise-api-irsa
