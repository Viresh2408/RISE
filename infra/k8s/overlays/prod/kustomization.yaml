apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rise-prod

resources:
  - ../../base
  - canary-ingress.yaml

# Prod image (registry/tag set by CI); overrides the base rise-api:latest.
images:
  - name: rise-api
    newName: ghcr.io/rise/rise-api
    newTag: prod

patches:
  - path: deployment.yaml
  - path: hpa-patch.yaml
  - path: serviceaccount-irsa.yaml

commonLabels:
  environment: production
  app.kubernetes.io/part-of: rise
