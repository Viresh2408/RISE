[tool.poetry]
name = "rise-monorepo"
version = "0.1.0"
description = "RISE — Autonomous Incident Remediation System Monorepo"
authors = ["RISE Team <dev@rise.local>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.0"
pyjwt = "^2.8.0"
pyyaml = "^6.0.1"
httpx = "^0.27.0"
qdrant-client = "^1.9.0"
sentence-transformers = "^3.0.0"
rise-core = { path = "packages/rise-core", develop = true }
redis = "^8.1.0"
cryptography = "^50.0.0"
langgraph = "^1.2.10"
langgraph-checkpoint-postgres = "^3.1.1"
psycopg-binary = "^3.3.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.8.0"
openapi-spec-validator = "^0.7.1"
schemathesis = "^3.25.0"


[tool.pytest.ini_options]
pythonpath = [".", "packages/rise-core"]
markers = [
    "integration: marks tests as integration tests requiring live Postgres + Qdrant (deselect with '-m not integration')",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
