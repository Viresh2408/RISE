# RISE API ServiceAccount.  The IRSA role ARN is environment-specific and is
# patched per overlay (see overlays/<env>/serviceaccount-irsa.yaml). The value
# here is a non-functional placeholder so `kubectl kustomize base` resolves.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rise-api
  labels:
    app: rise-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/PLACEHOLDER-rise-api-irsa
