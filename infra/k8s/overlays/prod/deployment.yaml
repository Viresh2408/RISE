apiVersion: apps/v1
kind: Deployment
metadata:
  name: rise-api
  namespace: rise-prod
spec:
  replicas: 5
  template:
    metadata:
      labels:
        app: rise-api
        tier: production
    spec:
      containers:
        - name: rise-api
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
