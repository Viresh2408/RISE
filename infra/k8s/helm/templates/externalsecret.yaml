{{- if .Values.secrets.externalSecretsOperator.enabled }}
# Projects the remote secret rise/<env>/rise-api (AWS Secrets Manager, read via
# the External Secrets Operator + IRSA role from Terraform) into a k8s Secret
# named rise-api-secrets, which the Deployment mounts via envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rise-api-secrets
  labels:
    {{- include "rise-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecretsOperator.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretsOperator.secretStore }}
    kind: ClusterSecretStore
  target:
    name: rise-api-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rise/{{ .Values.environment }}/rise-api
{{- end }}
